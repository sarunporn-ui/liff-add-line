<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI หมาคับ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; }
        /* ตั้งค่าปุ่มให้เห็นชัดเจน */
        .btn { 
            display: none; 
            background-color: #00b900; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 30px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px; 
            width: 100%;
        }
    </script>
</head>
<body>

    <div class="card">
        <h2 id="status">กำลังตรวจสอบ...</h2>
        <p id="sub-text">โปรดรอสักครู่</p>
        <button id="send-btn" class="btn" onclick="sendMessage()">กดส่งข้อความหา AI หมาคับ</button>
    </div>

    <script>
        async function main() {
            try {
                // ใช้ ID ของคุณ
                await liff.init({ liffId: "2009681507-7NYat0hP" });

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const friendship = await liff.getFriendship();
                    const btn = document.getElementById('send-btn');
                    const status = document.getElementById('status');
                    const subText = document.getElementById('sub-text');

                    if (friendship.friendFlag) {
                        status.innerText = "เราเป็นเพื่อนกันแล้ว!";
                        subText.innerText = "แตะที่ปุ่มด้านล่างเพื่อเริ่มคุยกับเรา";
                        // บังคับให้ปุ่มแสดงผล
                        btn.style.setProperty('display', 'block', 'important');
                    } else {
                        status.innerText = "ยังไม่ได้เพิ่มเพื่อน";
                        await liff.requestFriendship();
                        location.reload(); 
                    }
                }
            } catch (err) {
                document.getElementById('status').innerText = "เกิดข้อผิดพลาด";
                console.error(err);
            }
        }

        async function sendMessage() {
            try {
                await liff.sendMessages([{ type: 'text', text: 'สวัสดีครับ AI หมาคับ' }]);
                liff.closeWindow(); 
            } catch (err) {
                alert("ส่งไม่สำเร็จ: " + err.message);
            }
        }

        main();
    </script>
</body>
</html>
