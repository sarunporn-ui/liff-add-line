<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h1 id="status">กำลังตรวจสอบ...</h1>
    <script>
        async function main() {
            try {
                // ใส่ ID ให้ถูกต้อง
                await liff.init({ liffId: "2009681507-7NYat0hP" });

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const friendship = await liff.getFriendship();
                    if (!friendship.friendFlag) {
                        // ถ้ายังไม่เป็นเพื่อน ให้เด้งหน้าต่างขอเพิ่มเพื่อน
                        await liff.requestFriendship();
                    } else {
                        document.getElementById('status').innerText = "เราเป็นเพื่อนกันแล้ว!";
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }
        main();
    </script>
</body>
</html>
