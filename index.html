<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI หมาคับ - Welcome</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 400px; }
        #status { color: #333; font-size: 1.5rem; margin-bottom: 10px; }
        #sub-text { color: #666; margin-bottom: 20px; }
        /* ปุ่มส่งข้อความ */
        .btn-send { 
            display: none; /* ปิดไว้ก่อน จะเปิดเมื่อเป็นเพื่อนแล้ว */
            background-color: #00b900; 
            color: white; 
            border: none; 
            padding: 15px 25px; 
            border-radius: 30px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-send:active { background-color: #009e00; transform: scale(0.98); }
        #error-log { color: #dc3545; font-size: 0.8rem; margin-top: 20px; display: none; background: #fff1f0; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="status">กำลังตรวจสอบ...</h2>
        <p id="sub-text">โปรดรอสักครู่ ระบบกำลังทำงาน</p>
        
        <button id="send-btn" class="btn-send" onclick="sendMessage()">ส่งข้อความหา AI หมาคับ</button>

        <div id="error-log">
            <strong>Debug Info:</strong> <span id="err-text"></span>
        </div>
    </div>

    <script>
        async function main() {
            const statusEl = document.getElementById('status');
            const subTextEl = document.getElementById('sub-text');
            const sendBtn = document.getElementById('send-btn');
            const errLog = document.getElementById('error-log');
            const errText = document.getElementById('err-text');

            try {
                // 1. เชื่อมต่อ LIFF
                await liff.init({ liffId: "2009681507-7NYat0hP" });

                // 2. เช็ค Login
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // 3. เช็คสถานะเพื่อน
                    const friendship = await liff.getFriendship();
                    
                    if (friendship.friendFlag) {
                        // --- กรณีเป็นเพื่อนแล้ว ---
                        statusEl.innerText = "เราเป็นเพื่อนกันแล้ว!";
                        subTextEl.innerText = "กดปุ่มด้านล่างเพื่อส่งข้อความเข้าแชทและเริ่มใช้งานได้เลย";
                        sendBtn.style.display = "block"; // แสดงปุ่ม
                    } else {
                        // --- กรณีที่ยังไม่เป็นเพื่อน ---
                        statusEl.innerText = "คุณยังไม่ได้เพิ่มเพื่อน";
                        subTextEl.innerText = "กำลังเปิดหน้าต่างขอเพิ่มเพื่อน...";
                        await liff.requestFriendship();
                        // หลังจากปิดหน้าต่าง ให้โหลดใหม่เพื่อเข้าเงื่อนไข "เป็นเพื่อนแล้ว"
                        setTimeout(() => { location.reload(); }, 1000);
                    }
                }
            } catch (err) {
                statusEl.innerText = "เกิดข้อผิดพลาด";
                errLog.style.display = "block";
                errText.innerText = err.message;
                console.error(err);
            }
        }

        // ฟังก์ชันส่งข้อความ
        async function sendMessage() {
            try {
                await liff.sendMessages([
                    {
                        type: 'text',
                        text: 'สวัสดีครับ AI หมาคับ! (ส่งจาก LIFF)'
                    }
                ]);
                // ส่งเสร็จแล้วปิดหน้าเว็บทันทีเพื่อกลับไปหน้าแชท
                liff.closeWindow();
            } catch (err) {
                alert("ส่งไม่สำเร็จ: " + err.message + "\n(อย่าลืมเปิดสิทธิ์ chat_message.write ใน LINE Developers)");
            }
        }

        main();
    </script>
</body>
</html>
